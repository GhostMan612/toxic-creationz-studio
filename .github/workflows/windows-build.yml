name: Windows Build & Smoke Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-smoke-test:
    # windows-latest now resolves to the VS 2026 image, which has no VS 2022
    # instance for the "Visual Studio 17 2022" generator. Pin to windows-2022.
    runs-on: windows-2022

    steps:
    - name: Checkout repository with submodules
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Configure CMake (VS 2022 x64)
      run: cmake -B build -S . -G "Visual Studio 17 2022" -A x64

    - name: Build Release
      run: cmake --build build --config Release -j 4

    - name: Run Headless Engine Smoke Test
      run: |
        & ".\build\AIDAW_artefacts\Release\AI DAW.exe" --smoke-test
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Run Python MCP Unit Tests
      run: python -B -m unittest discover -s mcp -p "test_*.py" -v

    - name: Package Windows Release Artifact
      shell: pwsh
      run: .\scripts\package-windows.ps1 -BuildConfig Release -OutputDir dist

    - name: Validate Packaged Artifact
      shell: pwsh
      run: |
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        $zip = (Resolve-Path "dist\ToxicCreationzStudio-win64.zip").Path
        $archive = [System.IO.Compression.ZipFile]::OpenRead($zip)
        try {
          if ($archive.Entries.Count -lt 1) { throw "Release zip has no entries" }
          $entry = $archive.Entries | Where-Object { $_.Name -eq "Toxic Creationz Studio.exe" }
          if ($null -eq $entry -or $entry.Length -lt 1024) { throw "Release exe missing or truncated in zip" }
        } finally { $archive.Dispose() }
        Write-Host "[PACKAGE_VALIDATE] $zip OK"

    - name: Upload Windows Release Zip
      uses: actions/upload-artifact@v4
      with:
        name: ToxicCreationzStudio-win64
        path: dist/ToxicCreationzStudio-win64.zip
        retention-days: 14
